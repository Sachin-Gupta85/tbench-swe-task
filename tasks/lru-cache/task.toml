artifacts = ["/app/lrucache"]

schema_version = "2.0"

[task]
name = "insight/lrucache-bugfix"
description = "Fix three bugs in a fixed-capacity LRU cache: get() not refreshing recency, put() on an existing key not refreshing recency, and eviction removing the most-recently-used entry instead of the least. Graded by a hidden behavioural suite over eviction-order scenarios."

[metadata]
difficulty_explanation = "LRU correctness lives entirely in recency bookkeeping. All three defects produce a cache that 'works' for simple get/put but evicts the wrong key under realistic access patterns: a read that doesn't promote, an update that doesn't promote, and an eviction that pops the newest instead of the oldest. The fix requires understanding that both reads and writes are uses and that eviction targets the oldest."
solution_explanation = "Back the cache with an OrderedDict; move_to_end on get and on put-of-existing; on overflow popitem(last=False) to drop the least-recently-used. Three localized fixes, API unchanged."
verification_explanation = "A hidden suite checks eviction order across scenarios: a get that refreshes recency before an eviction, an update that refreshes recency, that a newly inserted item survives when it triggers eviction, plus len and the capacity guard. The reference passes all (Oracle = 1); the buggy version fails several (Nop = 0)."
category = "SWE"
subcategory = "Bug Fixing"
tags = ["python", "data-structures", "lru-cache", "bug-fixing", "ordereddict"]
expert_time_estimate_hours = 1
relevant_experience = "Implementing caches and eviction policies; reasoning about recency ordering."

[verifier]
timeout_sec = 600.0
environment_mode = "separate"

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 1024
storage_mb = 2048
gpus = 0
